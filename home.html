<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>幻灯片容器</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #1c1814;
      color: #f3ead8;
      font-family: "Noto Sans SC", sans-serif;

    p { margin: 0; opacity: 0.9; line-height: 1.6; text-align: center; max-width: 640px; }

<body>
  <p>菜单「文件 - 打开 HTML」选幻灯片。<br>F8 投屏，幻灯片里按 P 进演讲者视图。</p>
