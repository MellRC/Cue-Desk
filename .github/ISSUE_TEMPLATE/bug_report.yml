name: 问题反馈
description: 报告 CueDesk 的异常行为
title: "[问题] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: 问题描述
      description: 请说明实际发生了什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    attributes:
      label: CueDesk 版本
      placeholder: 例如 1.0.0
  - type: input
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2
